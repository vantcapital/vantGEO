<!-- ═══════════════════════════════════════════════════════════════
     BARRA DE AJUSTES — solo para afinar el diseño en desarrollo.
     No forma parte del sitio publicado: `python3 tools/build.py
     src/index.html index.html --produccion` la deja fuera del archivo.
     Todo lo que toca son variables CSS, así que nada de lo que hay
     aquí puede romper la maqueta.
     ═══════════════════════════════════════════════════════════════ -->
<style>
.aj{position:fixed;right:0;bottom:0;z-index:200;font-family:var(--mono);font-size:11px;
  color:var(--crema);max-width:min(340px,92vw)}
.aj-btn{position:absolute;right:16px;bottom:16px;display:inline-flex;align-items:center;gap:9px;
  background:var(--tinta);color:var(--crema);border:1px solid rgba(228,224,215,.24);
  padding:11px 15px;font:inherit;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  transition:border-color .3s var(--ease)}
.aj-btn:hover{border-color:var(--laton-claro)}
.aj-btn::before{content:'';width:7px;height:7px;background:var(--laton-claro);flex:none}
.aj[open] .aj-btn{display:none}
.aj-panel{display:none;background:var(--tinta);border:1px solid rgba(228,224,215,.2);
  margin:16px;max-height:min(76vh,660px);overflow-y:auto}
.aj[open] .aj-panel{display:block}
.aj-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid rgba(228,224,215,.16);position:sticky;top:0;
  background:var(--tinta);z-index:2}
.aj-cab strong{font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--laton-claro)}
.aj-cerrar{background:none;border:0;color:var(--crema-50);font:inherit;cursor:pointer;
  padding:4px 6px;line-height:1}
.aj-cerrar:hover{color:var(--crema)}
.aj-campo{padding:13px 16px;border-bottom:1px solid rgba(228,224,215,.1)}
.aj-campo > label,.aj-campo > .et{display:flex;justify-content:space-between;gap:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--crema-50);margin-bottom:9px}
.aj-campo .val{color:var(--laton-claro);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:.04em}
.aj input[type=range]{width:100%;accent-color:var(--laton-claro);background:transparent;margin:0}
.aj select{width:100%;background:#132323;color:var(--crema);border:1px solid rgba(228,224,215,.2);
  font:inherit;padding:8px 9px}
.aj-colores{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.aj-colores button{width:26px;height:26px;border:1px solid rgba(228,224,215,.28);cursor:pointer;padding:0}
.aj-colores button[aria-pressed=true]{outline:2px solid var(--crema);outline-offset:2px}
.aj-colores input[type=color]{width:34px;height:26px;padding:0;background:transparent;
  border:1px solid rgba(228,224,215,.28);cursor:pointer}
.aj-pie{display:flex;gap:8px;padding:13px 16px}
.aj-pie button{flex:1;background:transparent;color:var(--crema);border:1px solid rgba(228,224,215,.24);
  font:inherit;letter-spacing:.12em;text-transform:uppercase;padding:9px 8px;cursor:pointer;
  transition:background .3s var(--ease),color .3s var(--ease)}
.aj-pie button:hover{background:var(--laton-claro);color:var(--tinta);border-color:var(--laton-claro)}
.aj-nota{padding:0 16px 14px;color:var(--crema-50);line-height:1.6;text-transform:none;letter-spacing:.02em}
@media(max-width:520px){.aj-panel{max-height:64vh}}
</style>

<div class="aj" id="aj">
  <button class="aj-btn" type="button" aria-expanded="false" aria-controls="aj-panel">Ajustes</button>
  <div class="aj-panel" id="aj-panel" role="group" aria-label="Ajustes de diseño en vivo">
    <div class="aj-cab">
      <strong>Ajustes de diseño</strong>
      <button class="aj-cerrar" type="button" aria-label="Cerrar los ajustes">Cerrar</button>
    </div>

    <div class="aj-campo">
      <label for="aj-hero">Fondo del hero</label>
      <select id="aj-hero">
        <option value="panel">Claro con panel — la foto en columna propia</option>
        <option value="claro">Claro a sangre — la foto velada en papel</option>
        <option value="oscuro">Oscuro a sangre — velo petróleo</option>
      </select>
    </div>

    <div class="aj-campo">
      <label for="aj-serif">Tipografía de titulares</label>
      <select id="aj-serif" data-var="--serif">
        <option value="'Fraunces',Georgia,serif">Fraunces — la de marca</option>
        <option value="'Fraunces',Georgia,serif|italic">Fraunces cursiva</option>
        <option value="Georgia,'Times New Roman',serif">Georgia</option>
        <option value="'Times New Roman',Times,serif">Times New Roman</option>
        <option value="'IBM Plex Mono',monospace">IBM Plex Mono</option>
        <option value="ui-serif,'Iowan Old Style','Palatino Linotype',serif">Serif del sistema</option>
      </select>
    </div>

    <div class="aj-campo">
      <label for="aj-peso">Peso de titulares <span class="val" id="v-peso">300</span></label>
      <input type="range" id="aj-peso" min="200" max="500" step="25" value="300">
    </div>

    <div class="aj-campo">
      <label for="aj-opsz">Contraste tipográfico <span class="val" id="v-opsz">72</span></label>
      <input type="range" id="aj-opsz" min="9" max="144" step="1" value="72">
    </div>

    <div class="aj-campo">
      <label for="aj-base">Tamaño base <span class="val" id="v-base">16 px</span></label>
      <input type="range" id="aj-base" min="14" max="20" step="0.5" value="16">
    </div>

    <div class="aj-campo">
      <span class="et">Color de acento <span class="val" id="v-acento">#B08D57</span></span>
      <div class="aj-colores" role="group" aria-label="Color de acento">
        <button type="button" data-color="#B08D57" style="background:#B08D57" aria-label="Latón" aria-pressed="true"></button>
        <button type="button" data-color="#C9A46B" style="background:#C9A46B" aria-label="Latón claro" aria-pressed="false"></button>
        <button type="button" data-color="#A8763F" style="background:#A8763F" aria-label="Cobre" aria-pressed="false"></button>
        <button type="button" data-color="#8C8F6B" style="background:#8C8F6B" aria-label="Oliva" aria-pressed="false"></button>
        <button type="button" data-color="#7C4A45" style="background:#7C4A45" aria-label="Teja" aria-pressed="false"></button>
        <button type="button" data-color="#4E6E6B" style="background:#4E6E6B" aria-label="Verde niebla" aria-pressed="false"></button>
        <button type="button" data-color="#6B7A8C" style="background:#6B7A8C" aria-label="Pizarra" aria-pressed="false"></button>
        <input type="color" id="aj-color" value="#B08D57" aria-label="Color de acento a medida">
      </div>
      <p class="aj-nota" id="aj-aa" style="padding:9px 0 0"></p>
    </div>

    <div class="aj-campo">
      <label for="aj-grano">Intensidad del grano <span class="val" id="v-grano">4,5 %</span></label>
      <input type="range" id="aj-grano" min="0" max="14" step="0.5" value="4.5">
    </div>

    <div class="aj-campo">
      <label for="aj-vel">Velocidad de las animaciones <span class="val" id="v-vel">1,0×</span></label>
      <input type="range" id="aj-vel" min="0" max="3" step="0.1" value="1">
    </div>

    <div class="aj-campo">
      <label for="aj-seccion">Espaciado entre secciones <span class="val" id="v-seccion">88 px</span></label>
      <input type="range" id="aj-seccion" min="32" max="200" step="4" value="88">
    </div>

    <div class="aj-campo">
      <label for="aj-margen">Margen lateral <span class="val" id="v-margen">72 px</span></label>
      <input type="range" id="aj-margen" min="16" max="140" step="4" value="72">
    </div>

    <div class="aj-campo">
      <label for="aj-velo">Opacidad del velo del hero <span class="val" id="v-velo">80 %</span></label>
      <input type="range" id="aj-velo" min="40" max="100" step="1" value="80">
    </div>

    <div class="aj-pie">
      <button type="button" id="aj-reset">Restablecer</button>
      <button type="button" id="aj-copiar">Copiar CSS</button>
    </div>
    <p class="aj-nota">Los cambios se guardan en este navegador. «Copiar CSS» deja los tokens listos para pegar en <code>src/core.css</code>.</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  var aj = document.getElementById('aj');
  var panel = document.getElementById('aj-panel');
  var abrir = aj.querySelector('.aj-btn');
  var raiz = document.documentElement;
  var CLAVE = 'vant-ajustes';

  /* ── Abrir y cerrar ──────────────────────────────────────── */
  function set(abierto) {
    aj.toggleAttribute('open', abierto);
    abrir.setAttribute('aria-expanded', String(abierto));
    if (abierto) panel.querySelector('select').focus();
    else abrir.focus();
  }
  abrir.addEventListener('click', function () { set(true); });
  aj.querySelector('.aj-cerrar').addEventListener('click', function () { set(false); });
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && aj.hasAttribute('open')) set(false);
  });

  /* ── Contraste: el acento elegido puede no ser legible como
     texto, así que se oscurece hasta cumplir AA sobre el papel y
     ese tono es el que se usa para las letras. El acento original
     se queda en filetes y rellenos. ─────────────────────────── */
  function aRGB(h) {
    h = h.replace('#', '');
    return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }
  function lum(rgb) {
    var c = rgb.map(function (v) {
      v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function ratio(a, b) {
    var l1 = lum(a), l2 = lum(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  function hex(rgb) {
    return '#' + rgb.map(function (v) {
      return ('0' + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2);
    }).join('').toUpperCase();
  }
  var PAPEL = aRGB('#FAF8F3');
  function accesible(color) {
    var rgb = aRGB(color), k = 1;
    while (ratio(rgb, PAPEL) < 4.5 && k > 0.02) {
      k -= 0.04;
      rgb = aRGB(color).map(function (v) { return v * k; });
    }
    return { texto: hex(rgb), contraste: ratio(rgb, PAPEL).toFixed(2) };
  }

  /* ── Estado ──────────────────────────────────────────────── */
  var por_defecto = {
    hero: 'panel', serif: "'Fraunces',Georgia,serif", peso: 300, opsz: 72, base: 16,
    acento: '#B08D57', grano: 4.5, vel: 1, seccion: 88, margen: 72, velo: 80
  };
  var estado = Object.assign({}, por_defecto);
  try {
    var guardado = JSON.parse(localStorage.getItem(CLAVE) || '{}');
    Object.keys(por_defecto).forEach(function (k) {
      if (guardado[k] !== undefined) estado[k] = guardado[k];
    });
  } catch (e) { /* almacenamiento no disponible: se usan los valores por defecto */ }

  function num(n, d) { return String(n).replace('.', ','); }

  function aplica() {
    var e = estado, s = raiz.style;
    var cursiva = e.serif.indexOf('|italic') > -1;
    s.setProperty('--serif', e.serif.replace('|italic', ''));
    s.setProperty('--base', e.base + 'px');
    s.setProperty('--acento', e.acento);
    s.setProperty('--grano', e.grano / 100);
    s.setProperty('--vel', e.vel === 0 ? 0.001 : e.vel);
    s.setProperty('--seccion', e.seccion + 'px');
    s.setProperty('--margen', e.margen + 'px');
    var aa = accesible(e.acento);
    s.setProperty('--acento-txt', aa.texto);
    document.querySelectorAll('h1,h2,h3').forEach(function (h) {
      h.style.fontWeight = e.peso;
      h.style.fontStyle = cursiva ? 'italic' : '';
      h.style.fontVariationSettings = "'opsz' " + e.opsz;
    });
    var hero = document.querySelector('.hero');
    if (hero) {
      hero.classList.toggle('hero--oscuro', e.hero === 'oscuro');
      hero.classList.toggle('hero--panel', e.hero === 'panel');
      /* El velo se gobierna por variable, no reescribiendo el degradado:
         la misma opacidad sirve para el papel y para el petróleo. */
      hero.style.setProperty('--hero-velo', (e.velo / 100).toFixed(2));
    }
    /* Etiquetas */
    document.getElementById('v-peso').textContent = e.peso;
    document.getElementById('v-opsz').textContent = e.opsz;
    document.getElementById('v-base').textContent = num(e.base) + ' px';
    document.getElementById('v-acento').textContent = e.acento.toUpperCase();
    document.getElementById('v-grano').textContent = num(e.grano) + ' %';
    document.getElementById('v-vel').textContent = e.vel === 0 ? 'sin animación' : num(e.vel.toFixed(1)) + '×';
    document.getElementById('v-seccion').textContent = e.seccion + ' px';
    document.getElementById('v-margen').textContent = e.margen + ' px';
    document.getElementById('v-velo').textContent = e.velo + ' %';
    document.getElementById('aj-aa').textContent =
      'Texto en acento: ' + aa.texto + ' — contraste ' + aa.contraste + ':1 sobre papel.';
    try { localStorage.setItem(CLAVE, JSON.stringify(e)); } catch (err) { /* sin almacenamiento */ }
  }

  /* ── Conexiones ──────────────────────────────────────────── */
  function liga(id, clave, transforma) {
    var el = document.getElementById(id);
    el.value = estado[clave];
    el.addEventListener('input', function () {
      estado[clave] = transforma ? transforma(el.value) : el.value;
      aplica();
    });
  }
  liga('aj-hero', 'hero');
  liga('aj-serif', 'serif');
  liga('aj-peso', 'peso', Number);
  liga('aj-opsz', 'opsz', Number);
  liga('aj-base', 'base', Number);
  liga('aj-grano', 'grano', Number);
  liga('aj-vel', 'vel', Number);
  liga('aj-seccion', 'seccion', Number);
  liga('aj-margen', 'margen', Number);
  liga('aj-velo', 'velo', Number);

  var muestras = [].slice.call(aj.querySelectorAll('.aj-colores button'));
  var aMedida = document.getElementById('aj-color');
  function pintaMuestras() {
    muestras.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.color.toLowerCase() === estado.acento.toLowerCase()));
    });
    aMedida.value = estado.acento;
  }
  muestras.forEach(function (b) {
    b.addEventListener('click', function () {
      estado.acento = b.dataset.color; pintaMuestras(); aplica();
    });
  });
  aMedida.addEventListener('input', function () {
    estado.acento = aMedida.value; pintaMuestras(); aplica();
  });

  document.getElementById('aj-reset').addEventListener('click', function () {
    estado = Object.assign({}, por_defecto);
    ['aj-peso','aj-opsz','aj-base','aj-grano','aj-vel','aj-seccion','aj-margen','aj-velo']
      .forEach(function (id) {
        document.getElementById(id).value = estado[id.replace('aj-', '')];
      });
    document.getElementById('aj-serif').value = estado.serif;
    document.getElementById('aj-hero').value = estado.hero;
    pintaMuestras(); aplica();
  });

  document.getElementById('aj-copiar').addEventListener('click', function (ev) {
    var e = estado, aa = accesible(e.acento);
    var css = ':root{\n' +
      '  --serif:' + e.serif.replace('|italic', '') + ';\n' +
      '  --base:' + e.base + 'px;\n' +
      '  --acento:' + e.acento + ';\n' +
      '  --acento-txt:' + aa.texto + ';   /* contraste ' + aa.contraste + ':1 sobre papel */\n' +
      '  --grano:' + (e.grano / 100) + ';\n' +
      '  --vel:' + e.vel + ';\n' +
      '  --seccion:' + e.seccion + 'px;\n' +
      '  --margen:' + e.margen + 'px;\n' +
      '}\n/* Titulares: font-weight ' + e.peso + "; font-variation-settings:'opsz' " + e.opsz + '; */';
    var aviso = function (t) { ev.target.textContent = t; setTimeout(function () { ev.target.textContent = 'Copiar CSS'; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(css).then(function () { aviso('Copiado'); }, function () { console.log(css); aviso('En consola'); });
    else { console.log(css); aviso('En consola'); }
  });

  pintaMuestras();
  aplica();
})();
</script>
